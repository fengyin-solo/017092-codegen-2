<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23111' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='system-ui'>知</text></svg>" />
  <title>知识分布分析 - 知识配置平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="css/common.css" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    /* 商家 / 行业 维度切换（与批量导入 Tab 同一风格） */
    .dim-tab-btn {
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1.125rem;
      border-radius: 0.625rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--slate-600);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .dim-tab-btn:hover {
      background: var(--slate-100);
      border-color: var(--slate-200);
    }
    .dim-tab-btn.dim-tab-active {
      background: var(--slate-900);
      color: #fff;
      border-color: var(--slate-900);
    }
    /* 覆盖筛选开关 */
    .dim-tab-btn.dim-tab-ghost-active {
      background: #fffbeb;
      color: #92400e;
      border-color: #fcd34d;
    }
  </style>
</head>
<body class="bg-canvas text-slate-600 font-sans antialiased min-h-screen selection:bg-emerald-900 selection:text-white">
  <div id="app" class="flex min-h-screen">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon flex items-center justify-center">
          <span class="iconify" data-icon="lucide:book-open" data-width="20" data-height="20"></span>
        </div>
        <span class="sidebar-logo-text">知识配置平台</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item router-active"><span class="iconify nav-item-icon" data-icon="lucide:layout-dashboard" data-width="18" data-height="18"></span>概览</a>
        <a href="merchant.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:store" data-width="18" data-height="18"></span>商家知识</a>
        <a href="merchant-set.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:layers" data-width="18" data-height="18"></span>商家集合知识</a>
        <a href="industry.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:briefcase" data-width="18" data-height="18"></span>行业知识</a>
        <a href="global.html" class="nav-item"><span class="iconify nav-item-icon" data-icon="lucide:globe" data-width="18" data-height="18"></span>通用知识</a>
      </nav>
    </aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header class="app-header border-b border-slate-200">
        <span class="app-header-title text-slate-700 font-medium">知识配置平台</span>
      </header>
      <div class="flex-1 p-6 md:p-8 space-y-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <h2 class="section-title tracking-tight text-slate-900 mb-2">知识分布分析</h2>
            <p class="section-desc text-sm text-slate-500">按商家、行业查看知识数量与覆盖情况，统计口径与概览柱状图、饼图一致。</p>
          </div>
          <a href="index.html" class="btn-secondary inline-flex items-center gap-2 no-underline">
            <span class="iconify" data-icon="lucide:arrow-left" data-width="16" data-height="16"></span>返回概览
          </a>
        </div>

        <!-- 维度切换 -->
        <section class="premium-card rounded-xl border border-slate-100 shadow-sm px-5 py-4 flex flex-wrap items-center justify-between gap-4">
          <div class="inline-flex items-center gap-2">
            <button type="button" id="dimMerchantBtn" class="dim-tab-btn dim-tab-active"><span class="iconify" data-icon="lucide:store" data-width="16" data-height="16"></span>按商家</button>
            <button type="button" id="dimIndustryBtn" class="dim-tab-btn"><span class="iconify" data-icon="lucide:briefcase" data-width="16" data-height="16"></span>按行业</button>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-slate-500" id="dimSummaryText"></span>
            <button type="button" id="onlyUncoveredBtn" class="dim-tab-btn"><span class="iconify" data-icon="lucide:filter" data-width="15" data-height="15"></span>仅看未覆盖</button>
          </div>
        </section>

        <!-- 汇总指标 -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="distStats">
          <!-- 由脚本填充 -->
        </section>

        <!-- 分布图 -->
        <section class="premium-card rounded-xl border border-slate-100 shadow-sm p-6">
          <h3 class="text-base font-semibold text-slate-900 mb-1" id="distChartTitle">各商家知识数量</h3>
          <p class="text-xs text-slate-400 mb-4" id="distChartSub">数量为 0 的商家同样展示，便于排查知识覆盖缺口。</p>
          <div id="distChartWrap">
            <canvas id="distChart"></canvas>
          </div>
        </section>

        <!-- 明细列表 -->
        <section class="premium-card rounded-xl border border-slate-100 shadow-sm overflow-hidden">
          <div class="flex flex-wrap items-center justify-between gap-3 px-6 pt-5 pb-4">
            <h3 class="text-base font-semibold text-slate-900" id="distTableTitle">商家分布明细</h3>
            <span class="text-xs text-slate-400" id="distTableCount"></span>
          </div>
          <div class="table-wrap border-t border-slate-100">
            <table class="w-full text-sm">
              <thead>
                <tr id="distTableHead"><!-- 由脚本填充 --></tr>
              </thead>
              <tbody id="distTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/distribution.js"></script>
</body>
</html>
